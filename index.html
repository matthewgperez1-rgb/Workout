<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a28"><title>Training Log</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="fixes.css"><link rel="stylesheet" href="v3.css">
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e7eff9;background:#0c1421}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#27394f;color:#eff7ff}button.primary{background:#54c9bc;color:#082027;font-weight:750}button:disabled{opacity:.45}input,select,textarea{width:100%;background:#0c1624;color:#f0f4fa;border:1px solid #38485c;border-radius:9px;padding:11px;min-width:0}label{display:block;font-size:12px;color:#aebed0;margin:8px 0}label input,label select{margin-top:5px}header{padding:22px 16px 10px;max-width:900px;margin:auto}h1{margin:4px 0;font-size:27px}h2{font-size:18px;margin:2px 0 12px}h3{font-size:15px;margin:0 0 8px}p{line-height:1.45;color:#b2c2d6;font-size:14px}.muted{color:#879bad;font-size:12px}.eyebrow{color:#61d0c5;letter-spacing:.13em;font-weight:750;font-size:11px}.wrap{max-width:900px;margin:auto;padding:12px 14px 95px}nav{position:fixed;bottom:0;left:0;right:0;background:#101c2c;border-top:1px solid #273c52;display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}nav button{border-radius:0;background:transparent;flex:1;max-width:180px;font-size:12px;padding:16px 5px}nav button.active{color:#64e4d2;background:#1b3041}.card{border:1px solid #263c50;background:#152335;border-radius:15px;padding:16px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#203145;border-radius:10px;padding:12px 8px}.metric strong{display:block;font-size:21px;margin-bottom:3px}.metric span{font-size:11px;color:#b8c5d6}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row>*{min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.exercise{border-top:1px solid #304358;padding:13px 0}.exercise:first-of-type{border:0}.sets{display:grid;grid-template-columns:25px 1fr 1fr 1fr 40px;gap:6px;align-items:center;margin:7px 0}.sets input{padding:8px 5px;text-align:center}.sets button{padding:8px 2px}.sectiontitle{margin-top:16px;color:#69d1c6;font-size:12px;letter-spacing:.09em;text-transform:uppercase}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiny{font-size:12px}.right{text-align:right}.pill{border-radius:20px;background:#263c4b;padding:5px 9px;font-size:11px;color:#9fe0d7}.ok{color:#6addb2}.warn{color:#ffd188}canvas{width:100%;height:180px}a{color:#74dbd0}details{margin:12px 0}summary{cursor:pointer} .runrow{padding:12px 0;border-bottom:1px solid #304358}.runrow:last-child{border:0}@media(max-width:390px){.sets{grid-template-columns:20px 1fr 1fr 1fr 34px}header{padding-top:14px}}
</style></head>
<body><header><div class="eyebrow">TRAINING LOG</div><div class="row"><h1 id="heading">Today</h1><span class="pill" id="clock"></span></div><div class="muted" id="date"></div></header><main class="wrap" id="main"></main><nav id="nav"><button data-tab="today" class="active">Today</button><button data-tab="plan">Plan</button><button data-tab="history">History</button><button data-tab="progress">Progress</button><button data-tab="mobility">Mobility</button><button data-tab="settings">Settings</button></nav>
<script>

3:{name:'Mobility / recovery',kind:'rest',moves:[]},

5:{name:'Lower B — Athletic',kind:'lift',moves:[['Broad jump',3,3,0,'Full reset; quality landings','Power'],['Trap bar deadlift',3,6,2,'Crisp sets; no grinding','Strength'],['Step-up',3,8,2,'Each leg; controlled','Unilateral'],['Hip thrust or glute bridge',3,10,2,'Pause at top','Muscle'],['Farmer carry',3,30,2,'Seconds; strong posture','Carry'],['Side plank',2,30,0,'Seconds each side','Core'],['Hip flexor stretch',2,40,0,'Seconds each side','Mobility']]},
6:{name:'Optional mobility / lift',kind:'optional',moves:[['Easy sled push',4,20,0,'Meters, light','Conditioning'],['Turkish get-up',2,3,1,'Each side; light','Stability'],['Mobility flow',1,15,0,'Minutes','Mobility']]}
};
const runSpecs={
'2026-10-12':['W1 Easy + 6 Strides',38,'Easy conversational + six relaxed strides','7dxXAFCicjoRRvqTzibPWr'],
'2026-10-15':['W1 8 × 200m Controlled Speed',30,'Fast and smooth, not maximal','kb95rh8M92eXwkFEhocRGT'],
'2026-10-16':['W1 3 × 5 min Threshold',39,'Optional if fatigued','vxUJkv2vKBTi24mGEhvDUt'],
'2026-10-17':['W1 Long Easy 45',45,'Conversational; walk breaks allowed','rV2YgQsSoeAzN5ozpWY1Ee'],
'2026-10-19':['W2 Easy + 6 Strides',43,'Easy and relaxed','eXLZ8yo7QH3HR3yWWUrzbN'],
'2026-10-22':['W2 6 × 300m Speed',32,'Strong and even','395HLbzWiZJ2PdpnAUj1we'],
'2026-10-23':['W2 2 × 8 min Threshold',40,'Optional; protect Saturday run','tMH2fbNqGquuzcUeGRT7ri'],
'2026-10-24':['W2 Long Easy 50',50,'Conversational','e25kcRPTaJztjyKc9gBwJq'],
'2026-10-26':['W3 Easy + 8 Strides',46,'Smooth accelerations','pu9rLrPhLiAz2Fchc2oPQ2'],
'2026-10-29':['W3 6 × 400m CFT Repeats',35,'Repeatable pace','gZR7x6C6toL4Qc76yCsEsv'],
'2026-10-30':['W3 4 × 5 min Threshold',46,'Optional if fatigued','aDviz9CgKx3eUTZopURodr'],
'2026-10-31':['W3 Long Easy 55',55,'Easy; walk breaks allowed','tnu9KeJvS7UT6vUWkYTe3m'],
'2026-11-02':['W4 Easy + 6 Strides',38,'Relaxed strides','fYUx3kc4zqpna26UMZGpFD'],
'2026-11-05':['W4 880-yard Benchmark',22,'Even pacing; avoid unrealistic target','ivUf9TouS6vtmQAQq6FSgv'],
'2026-11-06':['W4 Easy 30',30,'Optional after benchmark','d3K8V4FozSJ57xn4pZb2WD'],
'2026-11-07':['W4 Long Easy 45',45,'Recovery week','mwg2uFDjWzctC3BPa2cBbU'],
'2026-11-09':['W5 Easy + 8 Strides',51,'Smooth','3qx63XbnRFiWPsMkQWjAHJ'],
'2026-11-12':['W5 Speed Endurance',35,'Controlled 600m repeats','uCdK1M2hR2S3oSQAeQkTPa'],
'2026-11-13':['W5 Threshold',51,'Optional','VEuLhpS1jiSNU5Niq1AnN'],
'2026-11-14':['W5 Long Easy 60',60,'Conversational','nVrSdoqqb51LL7S9ffNUML'],
'2026-11-16':['W6 Easy + 6 Strides',43,'Relaxed','sNDcp41P4XsrptNfrya1Qr'],
'2026-11-19':['W6 Drop Sets',34,'Controlled CFT speed','fvtsabDLBrdmhmFaekXTSx'],
'2026-11-20':['W6 Threshold',44,'Optional','gXqZPoFWTGd1ntQJ77Dpkf'],
'2026-11-21':['W6 Long Easy 55',55,'Easy','pgky4oPoSGoRXFYUvL3tLr'],
'2026-11-23':['W7 Easy + 6 Strides',48,'Relaxed','vXesT4wmgDkAa7D3sDj1Vq'],
'2026-11-26':['W7 Sharpening',35,'Repeatable, not maximal','5abAjnK18ejXWZeQgSA1kZ'],
'2026-11-27':['W7 Threshold',40,'Optional','76DX3icYQYE2Vq98K5JCRB'],
'2026-11-28':['W7 Long Easy 50',50,'Conversational','kvuwkmMEmBKikzfa6rSxvJ'],
'2026-11-30':['W8 Easy + 4 Strides',35,'Relaxed','2fRZScJQBkpe8tq4F3Dw44'],
'2026-12-03':['W8 880-yard Re-test',22,'Even pacing','odJP96gajfEni2y63m4rg9'],
'2026-12-04':['W8 Easy Shakeout',20,'Optional','mTGeFk34cjVHDx9dQnYyHJ'],
'2026-12-05':['W8 Long Easy 40',40,'Conversational','uUThj4AM6JV5FQRNqQfvLV']};
const fresh=()=>({schema:2,created:stamp(),updated:stamp(),lifts:[],runs:[],measurements:[],overrides:{},notes:{}});
let db;try{db=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){db=fresh()}
let tab='today',currentDate=TODAY(),lastSync='';
function persist(){db.updated=stamp();try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(err){alert('Training data could not be saved on this device. Export your records and check available storage.');return false}}
const el=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateShort=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short'});
const sec=id=>document.querySelector('[data-view="'+id+'"]');
function view(t){if(window.editSession&&el('lift-notes'))autosaveLift();window.editSession=null;tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));el('heading').textContent=({today:'Today',plan:'Training plan',history:'History',progress:'Progress',mobility:'Mobility',settings:'Settings'})[t];render()}
function clock(){let n=new Date();el('clock').textContent=n.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'});el('date').textContent=n.toLocaleDateString('en-US',{timeZone:'America/New_York',weekday:'long',month:'long',day:'numeric',year:'numeric'});if(TODAY()!==currentDate&&tab==='today'){currentDate=TODAY();render()}}
function plan(date){return db.overrides[date]??sessions[dayOf(date)]}
function lastSet(name){for(const log of [...db.lifts].reverse()){const a=log.exercises.find(e=>e.name===name);if(a){const s=[...a.sets].reverse().find(s=>s.done&&s.reps);if(s)return s}}return null}
function tempSession(date){const p=plan(date);let prior=db.lifts.find(l=>l.date===date);return prior??{id:crypto.randomUUID(),date,session:p.name,created:stamp(),exercises:p.moves.map(m=>({name:m[0],category:m[5],tip:m[4],sets:Array.from({length:m[1]},()=>({weight:lastSet(m[0])?.weight??m[3],reps:m[2],rir:2,done:false}))})),finished:false}}
function rCard(date){const a=runSpecs[date];if(!a)return '';const log=db.runs.find(x=>x.date===date);return '<div class="card"><div class="eyebrow">TREDICT RUN</div><h2>'+escapeHTML(a[0])+'</h2><p>'+escapeHTML(a[2])+' · '+a[1]+' min planned</p><a target="_blank" rel="noopener" href="https://www.tredict.com/app/training/activity/'+a[3]+'">Open original plan in Tredict</a><div class="actions"><button class="primary" onclick="runEditor(\''+date+'\')">'+(log?'Edit recorded run':'Record run')+'</button></div></div>'}
function today(){const date=currentDate,p=plan(date);let h='<div class="row"><span class="eyebrow">'+escapeHTML(dateShort(date))+'</span><button onclick="pickDate()">Change date</button></div>';h+='<div class="card"><h2>'+escapeHTML(p.name)+'</h2><p>'+ (p.kind==='lift'?'Strength · power · mobility':p.kind==='optional'?'Optional day; skip without penalty':'Recovery or planned running')+'</p>';if(p.moves.length)h+='<button class="primary" onclick="sessionEditor(\''+date+'\')">'+(db.lifts.some(x=>x.date===date)?'Open workout log':'Start workout')+'</button>';h+='</div>';h+=rCard(date);if(!p.moves.length&&!runSpecs[date])h+='<p>Nothing else scheduled. Recovery counts.</p>';return h}
function sessionEditor(date){const item=tempSession(date);window.editSession=item;let h='<div class="row"><button onclick="render()">← Back</button><span class="pill">'+dateShort(date)+'</span></div><div class="card"><h2>'+escapeHTML(item.session)+'</h2><p>Record each set as you train. Every change saves immediately on this device. RIR = reps remaining.</p>';item.exercises.forEach((e,i)=>{h+='<div class="exercise"><div class="row"><strong>'+escapeHTML(e.name)+'</strong><span class="pill">'+escapeHTML(e.category)+'</span></div><p class="muted">'+escapeHTML(e.tip)+'</p><div class="sets muted"><span>Set</span><span>lb</span><span>Reps / sec</span><span>RIR</span><span>Done</span></div>';e.sets.forEach((s,j)=>{h+='<div class="sets"><span class="tiny">'+(j+1)+'</span><input type="number" step="0.5" min="0" value="'+s.weight+'" data-e="'+i+'" data-s="'+j+'" data-k="weight"><input type="number" min="0" value="'+s.reps+'" data-e="'+i+'" data-s="'+j+'" data-k="reps"><input type="number" min="0" max="10" value="'+s.rir+'" data-e="'+i+'" data-s="'+j+'" data-k="rir"><input type="checkbox" '+(s.done?'checked':'')+' data-e="'+i+'" data-s="'+j+'" data-k="done"></div>'});h+='</div>'});h+='<div class="comparison" id="lift-save-status">Ready · changes save automatically</div><div class="row"><span class="subtle">Rest timer</span><span id="rest-count" class="pill-small">—</span><button onclick="startRest(90)">90 sec</button><button onclick="startRest(120)">2 min</button></div><label>Session notes<textarea id="lift-notes">'+escapeHTML(item.notes||'')+'</textarea></label><div class="actions"><button onclick="saveSession(false)">Save draft</button><button class="primary" onclick="saveSession(true)">Finish session</button></div></div>';el('main').innerHTML=h;el('main').querySelectorAll('[data-k]').forEach(input=>input.addEventListener('change',()=>{let s=window.editSession.exercises[+input.dataset.e].sets[+input.dataset.s];s[input.dataset.k]=input.type==='checkbox'?input.checked:Number(input.value);autosaveLift()}));el('lift-notes').addEventListener('input',autosaveLift)}
function autosaveLift(){const x=window.editSession;if(!x)return;x.notes=el('lift-notes')?.value??x.notes;x.updated=stamp();const at=db.lifts.findIndex(l=>l.id===x.id||l.date===x.date);if(at>=0)db.lifts[at]=x;else db.lifts.push(x);persist();const status=el('lift-save-status');if(status)status.textContent='Saved on this device · '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
let restInterval=null;function startRest(seconds){if(restInterval)clearInterval(restInterval);const finish=Date.now()+seconds*1000;const tick=()=>{const left=Math.max(0,Math.ceil((finish-Date.now())/1000));const node=el('rest-count');if(!node){clearInterval(restInterval);return}node.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left){clearInterval(restInterval);restInterval=null}};tick();restInterval=setInterval(tick,500)}
function saveSession(finish){const x=window.editSession;if(!x)return;x.notes=el('lift-notes').value;if(finish&&!x.exercises.some(e=>e.sets.some(s=>s.done))){alert('Mark at least one completed set before finishing.');return}x.finished=finish||x.finished;x.updated=stamp();const i=db.lifts.findIndex(l=>l.id===x.id||l.date===x.date);if(i>=0)db.lifts[i]=x;else db.lifts.push(x);persist();render();alert(finish?'Session completed and saved on this device.':'Draft saved on this device.')}
function runEditor(date){let r=db.runs.find(x=>x.date===date)||{id:crypto.randomUUID(),date,distance:'',minutes:'',seconds:0,effort:4,notes:'',source:'garmin-manual',avgHR:'',cadence:''};window.editRun=r;const p=runSpecs[date];el('main').innerHTML='<div class="card"><button onclick="render()">← Back</button><h2>'+(p?escapeHTML(p[0]):'Run')+'</h2><label>Date<input type="date" id="r-date" value="'+date+'"></label><div class="two"><label>Distance (miles)<input type="number" step=".01" min="0" id="r-miles" value="'+r.distance+'"></label><label>Minutes<input type="number" min="0" id="r-mins" value="'+r.minutes+'"></label></div><div class="two"><label>Seconds<input type="number" min="0" max="59" id="r-secs" value="'+r.seconds+'"></label><label>Effort (1–10)<input type="number" min="1" max="10" id="r-rpe" value="'+r.effort+'"></label></div><label>Notes<textarea id="r-notes">'+escapeHTML(r.notes)+'</textarea></label><button class="primary" onclick="saveRun()">Save run</button></div>'}
function saveRun(){const r=window.editRun;r.date=el('r-date').value;r.distance=Number(el('r-miles').value);r.minutes=Number(el('r-mins').value);r.seconds=Number(el('r-secs').value);r.effort=Number(el('r-rpe').value);r.notes=el('r-notes').value;r.avgHR=el('r-hr').value?Number(el('r-hr').value):null;r.cadence=el('r-cad').value?Number(el('r-cad').value):null;r.source='garmin-manual';r.updated=stamp();if(!(r.distance>0&&Number.isFinite(r.distance)&&Number.isInteger(r.minutes)&&r.minutes>=0&&Number.isInteger(r.seconds)&&r.seconds>=0&&r.seconds<60&&r.minutes*60+r.seconds>0&&r.effort>=1&&r.effort<=10)){alert('Enter a valid distance, elapsed time, and effort from 1 to 10.');return}const i=db.runs.findIndex(v=>v.id===r.id||v.date===r.date);if(i>=0)db.runs[i]=r;else db.runs.push(r);persist();render()}
function pickDate(){const x=prompt('Workout date (YYYY-MM-DD)',currentDate);if(x&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(new Date(x+'T12:00:00').getTime())){currentDate=x;render()}}
function planView(){let h='<div class="card"><h2>Weekly lift structure</h2><p>Four core strength sessions. Optional Saturday is never required. Running follows the existing Tredict Week 1–8 progression, without duplicate versions.</p>';[1,2,3,4,5,6,0].forEach(d=>{let x=sessions[d];h+='<div class="runrow"><strong>'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]+' · '+escapeHTML(x.name)+'</strong><span class="muted"> '+x.moves.length+' movements</span></div>'});h+='</div><div class="card"><h2>Scheduled Tredict runs</h2>';Object.entries(runSpecs).forEach(([date,p])=>{h+='<div class="runrow"><div class="row"><strong>'+dateShort(date)+'</strong><span>'+p[1]+' min</span></div><div class="muted">'+escapeHTML(p[0])+'</div><button onclick="currentDate=\''+date+'\';view(\'today\')">Open day</button></div>'});return h+'</div>'}
function history(){let entries=[...db.lifts.map(x=>({date:x.date,type:'Lift',title:x.session,detail:x.exercises.flatMap(e=>e.sets.filter(s=>s.done)).length+' sets recorded'})),...db.runs.map(x=>({date:x.date,type:'Run',title:x.distance+' mi',detail:pace(x.distance,x.minutes*60+x.seconds)+' /mi'}))].sort((a,b)=>b.date.localeCompare(a.date));return '<div class="card"><h2>Recorded sessions</h2>'+ (entries.length?entries.map(x=>'<div class="runrow"><span class="pill">'+x.type+'</span> <strong>'+dateShort(x.date)+' · '+escapeHTML(x.title)+'</strong><div class="muted">'+escapeHTML(x.detail)+'</div></div>').join(''):'<p>No completed records yet. This is separate from scheduled workouts.</p>')+'</div>'}
function pace(dist,sec){let v=Math.round(sec/dist);return dist>0&&sec>0?Math.floor(v/60)+':'+String(v%60).padStart(2,'0'):'—'}
function progress(){let sets=db.lifts.flatMap(l=>l.exercises.flatMap(e=>e.sets.filter(s=>s.done&&s.reps>0).map(s=>({...s,name:e.name,date:l.date}))));let latest={};sets.forEach(s=>{const old=latest[s.name];if(!old||s.date>=old.date&&s.weight>=old.weight)latest[s.name]=s});let miles=db.runs.reduce((a,x)=>a+x.distance,0);let h='<div class="grid"><div class="metric"><strong>'+db.lifts.filter(x=>x.finished).length+'</strong><span>Lift sessions</span></div><div class="metric"><strong>'+db.runs.length+'</strong><span>Runs</span></div><div class="metric"><strong>'+miles.toFixed(1)+'</strong><span>Run miles</span></div></div><div class="card"><h2>Working-weight records</h2><p>Highest logged completed working set by movement. Not estimated one-rep max.</p>';h+=Object.entries(latest).length?Object.entries(latest).map(([n,x])=>'<div class="runrow"><strong>'+escapeHTML(n)+'</strong><div class="muted">'+x.weight+' lb × '+x.reps+' · '+x.date+'</div></div>').join(''):'<p>No sets logged yet.</p>';h+='</div><div class="card"><h2>Running trends</h2>';h+=db.runs.length?db.runs.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>'<div class="runrow"><strong>'+dateShort(x.date)+'</strong> · '+x.distance+' mi · '+pace(x.distance,x.minutes*60+x.seconds)+' /mi</div>').join(''):'<p>No runs recorded yet.</p>';return h+'</div>'}
function settings(){return '<div class="card"><h2>GitHub backup</h2><p>Local saves work offline. To sync across devices, use a private GitHub repository dedicated to training data. Never store a personal access token in this public repository.</p><label>Private data repository (owner/repo)<input id="gh-repo" placeholder="username/private-training-data" value="'+escapeHTML(localStorage.getItem('rb_sync_repo')||'')+'"></label><label>Fine-grained GitHub token (Contents: read/write, restricted to private data repo)<input id="gh-token" type="password" placeholder="Not saved to disk" value="'+escapeHTML(sessionStorage.getItem('rb_sync_token')||'')+'"></label><div class="actions"><button onclick="syncConfig()">Use credentials</button><button onclick="syncGitHub(false)">Back up to GitHub</button><button onclick="syncGitHub(true)">Download from GitHub</button></div><p class="muted">Manual sync. Download overwrites this device after a confirmation. Run a backup before switching devices. The token stays only in this browser tab/session, not in the GitHub codebase.</p><div id="sync-status" class="muted"></div></div><div class="card"><h2>Data export / restore</h2><div class="actions"><button onclick="exportData()">Export JSON</button><button onclick="el(\'import-file\').click()">Import JSON</button><input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importData(this)"></div><p class="muted">Export is a separate safety copy. Existing Training Log v1 data is not deleted.</p></div><div class="card"><h2>Source</h2><a href="https://github.com/matthewgperez1-rgb/Workout" target="_blank">View code on GitHub</a></div>'}
function syncConfig(){let repo=el('gh-repo').value.trim(),token=el('gh-token').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){alert('Use owner/repo format');return}localStorage.setItem('rb_sync_repo',repo);if(token)sessionStorage.setItem('rb_sync_token',token);el('sync-status').textContent='Credentials loaded for this browser session.'}
async function syncGitHub(pull){syncConfig();const repo=localStorage.getItem('rb_sync_repo'),token=sessionStorage.getItem('rb_sync_token');if(!repo||!token){alert('Private repository and token required.');return}if(pull&&!confirm('Replace local Training Log v2 data with the saved GitHub data? Export a backup first.'))return;const status=el('sync-status');status.textContent='Contacting GitHub…';try{const url='https://api.github.com/repos/'+repo+'/contents/rangeboard-data.json';const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};let get=await fetch(url,{headers,cache:'no-store'});if(pull){if(!get.ok)throw Error('GitHub download: HTTP '+get.status);let meta=await get.json();let decoded=decodeURIComponent(Array.from(atob(meta.content.replace(/\s/g,'')),c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''));let next=JSON.parse(decoded);if(next.schema!==2||!Array.isArray(next.lifts)||!Array.isArray(next.runs))throw Error('Unsupported file format');db=next;persist();status.textContent='Downloaded. '+stamp();render();return}
if(get.status!==404&&!get.ok)throw Error('GitHub lookup: HTTP '+get.status);let old=get.ok?await get.json():null;let utf8=new TextEncoder().encode(JSON.stringify(db,null,2));let bin='';utf8.forEach(b=>bin+=String.fromCharCode(b));let body={message:'Update private Training Log training log',content:btoa(bin)};if(old)body.sha=old.sha;let resp=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});if(resp.status===409)throw Error('Sync conflict: remote data changed. Back up local JSON before resolving.');if(!resp.ok)throw Error('GitHub write: HTTP '+resp.status);status.textContent='Backed up to GitHub. '+stamp()}catch(e){status.textContent=e.message+' — local data is unchanged.'}}
function exportData(){const a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='rangeboard-'+TODAY()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function importData(input){try{let x=JSON.parse(await input.files[0].text());if(x.schema!==2||!Array.isArray(x.lifts)||!Array.isArray(x.runs))throw Error('Wrong format');if(!confirm('Replace this device’s Training Log v2 data?'))return;db=x;persist();render()}catch(e){alert(e.message)}}
function render(){if(window.editSession&&el('lift-notes'))autosaveLift();window.editSession=null;el('main').innerHTML=({today:today,plan:planView,history,progress,mobility,settings})[tab]();clock()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.tab));clock();render();setInterval(clock,30000);

/* v3 mobility library, honest daily dashboard, progression displays */
const mobilityPrograms=[
{id:'shoulder',title:'Shoulder & Thoracic Mobility',minutes:10,goal:'Comfortable overhead motion and scapular control',steps:[['Thoracic rotation',2,'6 each side'],['Wall slides',2,'8 slow reps'],['Scapular push-ups',2,'10 controlled reps'],['Controlled shoulder circles',2,'5 each direction']]},
{id:'hip',title:'Hip & Ankle Mobility',minutes:12,goal:'Hip and ankle movement useful for squatting and running',steps:[['90/90 hip transitions',2,'6 per side'],['Knee-to-wall ankle rocks',2,'10 per side'],['Supported split squat isometric',2,'20 sec each leg'],['Controlled hip rotations',2,'5 per side']]},
{id:'run',title:'Running Resilience',minutes:12,goal:'Gradual lower-leg capacity and single-leg control',steps:[['Straight-knee calf raises',2,'12 reps'],['Bent-knee calf raises',2,'12 reps'],['Tibialis raises',2,'12 reps'],['Single-leg balance',2,'30 seconds each']]},
{id:'recovery',title:'Recovery Flow',minutes:10,goal:'Gentle movement on stiff or lower-energy days',steps:[['Easy walking',1,'3 minutes'],['Cat-cow',1,'8 slow reps'],['Child pose side reaches',2,'30 seconds per side'],['Hip 90/90 switches',1,'8 slow reps']]}
];
db.mobility??=[];
function mKey(date,id){return date+'|'+id}
function completedMobility(date,id){return db.mobility.find(x=>x.date===date&&x.program===id&&x.completed)}
function mobility(){return '<div class="card"><h2>Optional mobility sessions</h2><p>Independent of your strength and running schedule. Complete them when useful; missed sessions do not count against your training consistency.</p></div><div class="day-stack">'+mobilityPrograms.map(m=>'<div class="day-card"><div class="tag">OPTIONAL · '+m.minutes+' MIN</div><h2>'+m.title+'</h2><p>'+m.goal+'</p><div class="row"><span class="subtle">'+m.steps.length+' movements</span>'+(completedMobility(currentDate,m.id)?'<span class="pill-small">Completed today</span>':'')+'</div><button class="primary" onclick="openMobility(\''+m.id+'\')">Open routine</button></div>').join('')+'</div>'}
function openMobility(id){const m=mobilityPrograms.find(x=>x.id===id);if(!m)return;const date=currentDate;const existing=db.mobility.find(x=>x.date===date&&x.program===id);const checks=existing?.checks||[];el('main').innerHTML='<div class="card"><button onclick="view(\'mobility\')">← Back</button><h2>'+m.title+'</h2><p>'+m.goal+'</p><div class="muted">'+m.minutes+' minutes · Optional</div>'+m.steps.map((x,i)=>'<div class="mobility-step"><label><input type="checkbox" data-ms="'+i+'" '+(checks.includes(i)?'checked':'')+'><span><strong>'+x[0]+'</strong><br><span class="subtle">'+x[1]+' sets · '+x[2]+'</span></span></label></div>').join('')+'<div class="actions"><button class="primary" onclick="saveMobility(\''+id+'\')">Save routine</button></div></div>'}
function saveMobility(id){const checks=[...el('main').querySelectorAll('[data-ms]:checked')].map(x=>Number(x.dataset.ms));const m=mobilityPrograms.find(x=>x.id===id);const item={id:mKey(currentDate,id),date:currentDate,program:id,checks,completed:checks.length===m.steps.length,updated:stamp()};const at=db.mobility.findIndex(x=>x.id===item.id);if(at>=0)db.mobility[at]=item;else db.mobility.push(item);persist();view('mobility')}
function compareFor(name,date){const prior=db.lifts.filter(x=>x.date<date).sort((a,b)=>b.date.localeCompare(a.date)).flatMap(l=>l.exercises.filter(e=>e.name===name).flatMap(e=>e.sets.filter(x=>x.done)));if(!prior.length)return 'First recorded session';return 'Previous completed set: '+prior[0].weight+' lb × '+prior[0].reps+' · RIR '+prior[0].rir}
function trainingConsistency(){const now=new Date(currentDate+'T12:00:00');return Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(d.getDate()-((d.getDay()+6)%7)+i);const date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return {date,done:db.lifts.some(x=>x.date===date&&x.finished)||db.runs.some(x=>x.date===date)}})}
function dayDashboard(){const p=plan(currentDate),r=runSpecs[currentDate],lift=db.lifts.find(x=>x.date===currentDate),run=db.runs.find(x=>x.date===currentDate),week=trainingConsistency();const optional=mobilityPrograms.filter(m=>m.id===(p.kind==='lift'?'shoulder':'recovery')||m.id==='hip');return '<div class="day-stack"><div class="day-card"><div class="row"><span class="tag">STRENGTH</span><span class="pill-small">'+(lift?.finished?'Logged':lift?'In progress':p.kind==='lift'?'Planned':'Recovery')+'</span></div><h2>'+p.name+'</h2><p>'+(p.kind==='lift'?p.moves.length+' movements · strength, stability and mobility':p.kind==='optional'?'Optional session':'No required lift')+'</p>'+(p.moves.length?'<button class="primary" onclick="sessionEditor(\''+currentDate+'\')">'+(lift?'Open log':'Start session')+'</button>':'')+'</div><div class="day-card"><div class="row"><span class="tag">RUNNING</span><span class="pill-small">'+(run?'Logged':r?'Planned':'No planned run')+'</span></div><h2>'+(r?escapeHTML(r[0]):run?'Run recorded':'No scheduled run')+'</h2><p>'+(run?run.distance+' miles · '+pace(run.distance,run.minutes*60+run.seconds)+' /mile':r?r[1]+' minutes · '+escapeHTML(r[2]):'Check your Tredict plan for other dates')+'</p>'+(r||run?'<button class="primary" onclick="runEditor(\''+currentDate+'\')">'+(run?'Edit run':'Record run')+'</button>':'<button onclick="runEditor(\''+currentDate+'\')">Record unscheduled run</button>')+'</div><div class="day-card full"><h3>Optional mobility</h3><div class="button-row">'+optional.map(m=>'<button onclick="openMobility(\''+m.id+'\')">'+m.title+' · '+m.minutes+' min</button>').join('')+'</div></div><div class="day-card full"><h3>This week</h3><div class="timeline">'+week.map(x=>'<span class="'+(x.done?'hit':'')+'">'+dateShort(x.date).split(',')[0]+' '+(x.done?'✓':'')+'</span>').join('')+'</div><div class="mini-row"><span>Strength sessions logged</span><span>'+week.filter(x=>db.lifts.some(l=>l.date===x.date&&l.finished)).length+' / 4 target</span></div><div class="mini-row"><span>Runs logged</span><span>'+week.filter(x=>db.runs.some(r=>r.date===x.date)).length+'</span></div></div></div>'}
const oldToday=today;
today=dayDashboard;
const oldSessionEditor=sessionEditor;
sessionEditor=function(date){oldSessionEditor(date);document.querySelectorAll('.exercise').forEach((node,i)=>{const e=window.editSession.exercises[i];const line=document.createElement('div');line.className='comparison';line.textContent=compareFor(e.name,date);node.querySelector('.row')?.after(line)})};
const oldHistory=history;
history=function(){let r=oldHistory();const m=db.mobility.filter(x=>x.completed).sort((a,b)=>b.date.localeCompare(a.date));if(m.length)r+='<div class="card"><h2>Mobility completed</h2>'+m.map(x=>'<div class="mini-row"><span>'+dateShort(x.date)+'</span><span>'+escapeHTML(mobilityPrograms.find(m=>m.id===x.program)?.title||x.program)+'</span></div>').join('')+'</div>';return r};


/* Verified progressive-program module. Falls back to existing logs if module is unavailable. */
import('./training-core.mjs').then(core=>{window.trainingCore=core;render()}).catch(err=>console.warn('Progression module unavailable',err));
const previousPlan=planView;
planView=function(){
 const core=window.trainingCore,w=core?.trainingWeek(currentDate)||1,phase=core?.phaseForWeek(w);
 const intro='<div class="card"><div class="row"><h2>Strength block · Week '+w+' of 12</h2><span class="pill-small">'+(phase?.label||'Foundation')+'</span></div><p>'+(phase?.effort||'Build movement quality')+'. This is a starting prescription, not an automatic load increase.</p><p class="muted">Weeks 4, 8, and 12 reduce volume. Running remains on the Tredict schedule and takes priority if fatigue is excessive.</p></div>';
 return intro+previousPlan();
};
const previousEditor=sessionEditor;
sessionEditor=function(date){
 previousEditor(date);
 const core=window.trainingCore;
 if(!core)return;
 const week=core.trainingWeek(date),phase=core.phaseForWeek(week);
 const head=document.querySelector('#main .card h2');
 if(head)head.insertAdjacentHTML('afterend','<p class="muted">Week '+week+' · '+phase.label+' · '+phase.effort+'</p>');
 document.querySelectorAll('.exercise').forEach((node,i)=>{
   const e=window.editSession?.exercises[i];if(!e)return;
   const recommendation=core.prescribe(e,db.lifts,date);
   const p=document.createElement('div');p.className='movement-info';p.textContent=recommendation.message;
   node.querySelector('.comparison')?.after(p);
 });
};
const previousProgress=progress;
progress=function(){
 const core=window.trainingCore;if(!core)return previousProgress();
 const strength=core.liftSummary(db.lifts),running=core.runSummary(db.runs);
 const stat='<div class="card"><h2>Recorded training totals</h2><div class="grid"><div class="metric"><strong>'+strength.sets+'</strong><span>Completed sets</span></div><div class="metric"><strong>'+running.miles.toFixed(1)+'</strong><span>Run miles</span></div><div class="metric"><strong>'+(running.averagePaceSeconds?pace(1,running.averagePaceSeconds):'—')+'</strong><span>Overall pace /mi</span></div></div><p class="muted">Pace is total recorded time divided by total distance, not a prediction of race fitness.</p></div>';
 return stat+previousProgress();
};
