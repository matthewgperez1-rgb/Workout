<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a28"><title>Range Board</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e7eff9;background:#0c1421}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#27394f;color:#eff7ff}button.primary{background:#54c9bc;color:#082027;font-weight:750}button:disabled{opacity:.45}input,select,textarea{width:100%;background:#0c1624;color:#f0f4fa;border:1px solid #38485c;border-radius:9px;padding:11px;min-width:0}label{display:block;font-size:12px;color:#aebed0;margin:8px 0}label input,label select{margin-top:5px}header{padding:22px 16px 10px;max-width:900px;margin:auto}h1{margin:4px 0;font-size:27px}h2{font-size:18px;margin:2px 0 12px}h3{font-size:15px;margin:0 0 8px}p{line-height:1.45;color:#b2c2d6;font-size:14px}.muted{color:#879bad;font-size:12px}.eyebrow{color:#61d0c5;letter-spacing:.13em;font-weight:750;font-size:11px}.wrap{max-width:900px;margin:auto;padding:12px 14px 95px}nav{position:fixed;bottom:0;left:0;right:0;background:#101c2c;border-top:1px solid #273c52;display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}nav button{border-radius:0;background:transparent;flex:1;max-width:180px;font-size:12px;padding:16px 5px}nav button.active{color:#64e4d2;background:#1b3041}.card{border:1px solid #263c50;background:#152335;border-radius:15px;padding:16px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#203145;border-radius:10px;padding:12px 8px}.metric strong{display:block;font-size:21px;margin-bottom:3px}.metric span{font-size:11px;color:#b8c5d6}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row>*{min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.exercise{border-top:1px solid #304358;padding:13px 0}.exercise:first-of-type{border:0}.sets{display:grid;grid-template-columns:25px 1fr 1fr 1fr 40px;gap:6px;align-items:center;margin:7px 0}.sets input{padding:8px 5px;text-align:center}.sets button{padding:8px 2px}.sectiontitle{margin-top:16px;color:#69d1c6;font-size:12px;letter-spacing:.09em;text-transform:uppercase}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiny{font-size:12px}.right{text-align:right}.pill{border-radius:20px;background:#263c4b;padding:5px 9px;font-size:11px;color:#9fe0d7}.ok{color:#6addb2}.warn{color:#ffd188}canvas{width:100%;height:180px}a{color:#74dbd0}details{margin:12px 0}summary{cursor:pointer} .runrow{padding:12px 0;border-bottom:1px solid #304358}.runrow:last-child{border:0}@media(max-width:390px){.sets{grid-template-columns:20px 1fr 1fr 1fr 34px}header{padding-top:14px}}
</style></head>
<body><header><div class="eyebrow">RANGE BOARD</div><div class="row"><h1 id="heading">Today</h1><span class="pill" id="clock"></span></div><div class="muted" id="date"></div></header><main class="wrap" id="main"></main><nav id="nav"><button data-tab="today" class="active">Today</button><button data-tab="plan">Plan</button><button data-tab="history">History</button><button data-tab="progress">Progress</button><button data-tab="settings">Settings</button></nav>

5:{name:'Lower B — Athletic',kind:'lift',moves:[['Broad jump',3,3,0,'Full reset; quality landings','Power'],['Trap bar deadlift',3,6,2,'Crisp sets; no grinding','Strength'],['Step-up',3,8,2,'Each leg; controlled','Unilateral'],['Hip thrust or glute bridge',3,10,2,'Pause at top','Muscle'],['Farmer carry',3,30,2,'Seconds; strong posture','Carry'],['Side plank',2,30,0,'Seconds each side','Core'],['Hip flexor stretch',2,40,0,'Seconds each side','Mobility']]},
6:{name:'Optional mobility / lift',kind:'optional',moves:[['Easy sled push',4,20,0,'Meters, light','Conditioning'],['Turkish get-up',2,3,1,'Each side; light','Stability'],['Mobility flow',1,15,0,'Minutes','Mobility']]}
};
const runSpecs={
'2026-10-12':['W1 Easy + 6 Strides',38,'Easy conversational + six relaxed strides','7dxXAFCicjoRRvqTzibPWr'],
'2026-10-15':['W1 8 × 200m Controlled Speed',30,'Fast and smooth, not maximal','kb95rh8M92eXwkFEhocRGT'],
'2026-10-16':['W1 3 × 5 min Threshold',39,'Optional if fatigued','vxUJkv2vKBTi24mGEhvDUt'],
'2026-10-17':['W1 Long Easy 45',45,'Conversational; walk breaks allowed','rV2YgQsSoeAzN5ozpWY1Ee'],
'2026-10-19':['W2 Easy + 6 Strides',43,'Easy and relaxed','eXLZ8yo7QH3HR3yWWUrzbN'],
'2026-10-22':['W2 6 × 300m Speed',32,'Strong and even','395HLbzWiZJ2PdpnAUj1we'],
'2026-10-23':['W2 2 × 8 min Threshold',40,'Optional; protect Saturday run','tMH2fbNqGquuzcUeGRT7ri'],
'2026-10-24':['W2 Long Easy 50',50,'Conversational','e25kcRPTaJztjyKc9gBwJq'],
'2026-10-26':['W3 Easy + 8 Strides',46,'Smooth accelerations','pu9rLrPhLiAz2Fchc2oPQ2'],
'2026-10-29':['W3 6 × 400m CFT Repeats',35,'Repeatable pace','gZR7x6C6toL4Qc76yCsEsv'],
'2026-10-30':['W3 4 × 5 min Threshold',46,'Optional if fatigued','aDviz9CgKx3eUTZopURodr'],
'2026-10-31':['W3 Long Easy 55',55,'Easy; walk breaks allowed','tnu9KeJvS7UT6vUWkYTe3m'],
'2026-11-02':['W4 Easy + 6 Strides',38,'Relaxed strides','fYUx3vPZdQ6z3WGxqHqc2'],
'2026-11-05':['W4 880-yard Benchmark',22,'Even pacing; avoid unrealistic target','ivUf9TouS6vtmQAQq6FSgv'],
'2026-11-06':['W4 Easy 30',30,'Optional after benchmark','d3K8V4FozSJ57xn4pZb2WD'],
'2026-11-07':['W4 Long Easy 45',45,'Recovery week','mwg2uFDjWzctC3BPa2cBbU'],
'2026-11-09':['W5 Easy + 8 Strides',51,'Smooth','3qx63XbnRFiWPsMkQWjAHJ'],
'2026-11-12':['W5 Speed Endurance',35,'Controlled 600m repeats','uCdK1M2hR2S3oSQAeQkTPa'],

'2026-11-19':['W6 Drop Sets',34,'Controlled CFT speed','fvtsabDLBrdmhmFaekXTSx'],
'2026-11-20':['W6 Threshold',44,'Optional','gXqZPoFWTGd1ntQJ77Dpkf'],
'2026-11-21':['W6 Long Easy 55',55,'Easy','pgky4oPoSGoRXFYUvL3tLr'],
'2026-11-23':['W7 Easy + 6 Strides',48,'Relaxed','vXesT4wmgDkAa7D3sDj1Vq'],
'2026-11-26':['W7 Sharpening',35,'Repeatable, not maximal','5abAjnK18ejXWZeQgSA1kZ'],
'2026-11-27':['W7 Threshold',40,'Optional','76DX3icYQYE2Vq98K5JCRB'],
'2026-11-28':['W7 Long Easy 50',50,'Conversational','kvuwkmMEmBKikzfa6rSxvJ'],
'2026-11-30':['W8 Easy + 4 Strides',35,'Relaxed','2fRZScJQBkpe8tq4F3Dw44'],
'2026-12-03':['W8 880-yard Re-test',22,'Even pacing','odJP96gajfEni2y63m4rg9'],
'2026-12-04':['W8 Easy Shakeout',20,'Optional','mTGeFk34cjVHDx9dQnYyHJ'],
'2026-12-05':['W8 Long Easy 40',40,'Conversational','uUThj4AM6JV5FQRNqQfvLV']};
const fresh=()=>({schema:2,created:stamp(),updated:stamp(),lifts:[],runs:[],measurements:[],overrides:{},notes:{}});
let db;try{db=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){db=fresh()}
let tab='today',currentDate=TODAY(),lastSync='';
function persist(){db.updated=stamp();localStorage.setItem(KEY,JSON.stringify(db))}
const el=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateShort=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short'});
const sec=id=>document.querySelector('[data-view="'+id+'"]');
function view(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));el('heading').textContent=({today:'Today',plan:'Training plan',history:'History',progress:'Progress',settings:'Settings'})[t];render()}
function clock(){let n=new Date();el('clock').textContent=n.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'});el('date').textContent=n.toLocaleDateString('en-US',{timeZone:'America/New_York',weekday:'long',month:'long',day:'numeric',year:'numeric'});if(TODAY()!==currentDate&&tab==='today'){currentDate=TODAY();render()}}
function plan(date){return db.overrides[date]??sessions[dayOf(date)]}
function lastSet(name){for(const log of [...db.lifts].reverse()){const a=log.exercises.find(e=>e.name===name);if(a){const s=[...a.sets].reverse().find(s=>s.done&&s.reps);if(s)return s}}return null}
function tempSession(date){const p=plan(date);let prior=db.lifts.find(l=>l.date===date);return prior??{id:crypto.randomUUID(),date,session:p.name,created:stamp(),exercises:p.moves.map(m=>({name:m[0],category:m[5],tip:m[4],sets:Array.from({length:m[1]},()=>({weight:lastSet(m[0])?.weight??m[3],reps:m[2],rir:2,done:false}))})),finished:false}}
function rCard(date){const a=runSpecs[date];if(!a)return '';const log=db.runs.find(x=>x.date===date);return '<div class="card"><div class="eyebrow">TREDICT RUN</div><h2>'+escapeHTML(a[0])+'</h2><p>'+escapeHTML(a[2])+' · '+a[1]+' min planned</p><a target="_blank" rel="noopener" href="https://www.tredict.com/app/training/activity/'+a[3]+'">Open original plan in Tredict</a><div class="actions"><button class="primary" onclick="runEditor(\''+date+'\')">'+(log?'Edit recorded run':'Record run')+'</button></div></div>'}
function today(){const date=currentDate,p=plan(date);let h='<div class="row"><span class="eyebrow">'+escapeHTML(dateShort(date))+'</span><button onclick="pickDate()">Change date</button></div>';h+='<div class="card"><h2>'+escapeHTML(p.name)+'</h2><p>'+ (p.kind==='lift'?'Strength · power · mobility':p.kind==='optional'?'Optional day; skip without penalty':'Recovery or planned running')+'</p>';if(p.moves.length)h+='<button class="primary" onclick="sessionEditor(\''+date+'\')">'+(db.lifts.some(x=>x.date===date)?'Open workout log':'Start workout')+'</button>';h+='</div>';h+=rCard(date);if(!p.moves.length&&!runSpecs[date])h+='<p>Nothing else scheduled. Recovery counts.</p>';return h}
function sessionEditor(date){const item=tempSession(date);window.editSession=item;let h='<div class="row"><button onclick="render()">← Back</button><span class="pill">'+dateShort(date)+'</span></div><div class="card"><h2>'+escapeHTML(item.session)+'</h2><p>Record each completed set. Weight in pounds; zero for bodyweight or time-based sets. RIR = reps you could still complete.</p>';item.exercises.forEach((e,i)=>{h+='<div class="exercise"><div class="row"><strong>'+escapeHTML(e.name)+'</strong><span class="pill">'+escapeHTML(e.category)+'</span></div><p class="muted">'+escapeHTML(e.tip)+'</p><div class="sets muted"><span>Set</span><span>lb</span><span>Reps / sec</span><span>RIR</span><span>Done</span></div>';e.sets.forEach((s,j)=>{h+='<div class="sets"><span class="tiny">'+(j+1)+'</span><input type="number" step="0.5" min="0" value="'+s.weight+'" data-e="'+i+'" data-s="'+j+'" data-k="weight"><input type="number" min="0" value="'+s.reps+'" data-e="'+i+'" data-s="'+j+'" data-k="reps"><input type="number" min="0" max="10" value="'+s.rir+'" data-e="'+i+'" data-s="'+j+'" data-k="rir"><input type="checkbox" '+(s.done?'checked':'')+' data-e="'+i+'" data-s="'+j+'" data-k="done"></div>'});h+='</div>'});h+='<label>Session notes<textarea id="lift-notes">'+escapeHTML(item.notes||'')+'</textarea></label><div class="actions"><button onclick="saveSession(false)">Save draft</button><button class="primary" onclick="saveSession(true)">Finish session</button></div></div>';el('main').innerHTML=h;el('main').querySelectorAll('[data-k]').forEach(input=>input.addEventListener('change',()=>{let s=window.editSession.exercises[+input.dataset.e].sets[+input.dataset.s];s[input.dataset.k]=input.type==='checkbox'?input.checked:Number(input.value)}))}
function saveSession(finish){const x=window.editSession;x.notes=el('lift-notes').value;x.finished=finish||x.finished;x.updated=stamp();const i=db.lifts.findIndex(l=>l.id===x.id||l.date===x.date);if(i>=0)db.lifts[i]=x;else db.lifts.push(x);persist();render();alert(finish?'Session completed and saved on this device.':'Draft saved on this device.')}
function runEditor(date){let r=db.runs.find(x=>x.date===date)||{id:crypto.randomUUID(),date,distance:'',minutes:'',seconds:0,effort:4,notes:'',source:'manual'};window.editRun=r;const p=runSpecs[date];el('main').innerHTML='<div class="card"><button onclick="render()">← Back</button><h2>'+(p?escapeHTML(p[0]):'Run')+'</h2><label>Date<input type="date" id="r-date" value="'+date+'"></label><div class="two"><label>Distance (miles)<input type="number" step=".01" min="0" id="r-miles" value="'+r.distance+'"></label><label>Minutes<input type="number" min="0" id="r-mins" value="'+r.minutes+'"></label></div><div class="two"><label>Seconds<input type="number" min="0" max="59" id="r-secs" value="'+r.seconds+'"></label><label>Effort (1–10)<input type="number" min="1" max="10" id="r-rpe" value="'+r.effort+'"></label></div><label>Notes<textarea id="r-notes">'+escapeHTML(r.notes)+'</textarea></label><button class="primary" onclick="saveRun()">Save run</button></div>'}
function saveRun(){const r=window.editRun;r.date=el('r-date').value;r.distance=Number(el('r-miles').value);r.minutes=Number(el('r-mins').value);r.seconds=Number(el('r-secs').value);r.effort=Number(el('r-rpe').value);r.notes=el('r-notes').value;r.updated=stamp();if(!(r.distance>0&&r.minutes*60+r.seconds>0)){alert('Enter positive distance and time.');return}const i=db.runs.findIndex(v=>v.id===r.id||v.date===r.date);if(i>=0)db.runs[i]=r;else db.runs.push(r);persist();render()}
function pickDate(){const x=prompt('Workout date (YYYY-MM-DD)',currentDate);if(x&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(new Date(x+'T12:00:00').getTime())){currentDate=x;render()}}
function planView(){let h='<div class="card"><h2>Weekly lift structure</h2><p>Four core strength sessions. Optional Saturday is never required. Running follows the existing Tredict Week 1–8 progression, without duplicate versions.</p>';[1,2,3,4,5,6,0].forEach(d=>{let x=sessions[d];h+='<div class="runrow"><strong>'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]+' · '+escapeHTML(x.name)+'</strong><span class="muted"> '+x.moves.length+' movements</span></div>'});h+='</div><div class="card"><h2>Scheduled Tredict runs</h2>';Object.entries(runSpecs).forEach(([date,p])=>{h+='<div class="runrow"><div class="row"><strong>'+dateShort(date)+'</strong><span>'+p[1]+' min</span></div><div class="muted">'+escapeHTML(p[0])+'</div><button onclick="currentDate=\''+date+'\';view(\'today\')">Open day</button></div>'});return h+'</div>'}
function history(){let entries=[...db.lifts.map(x=>({date:x.date,type:'Lift',title:x.session,detail:x.exercises.flatMap(e=>e.sets.filter(s=>s.done)).length+' sets recorded'})),...db.runs.map(x=>({date:x.date,type:'Run',title:x.distance+' mi',detail:pace(x.distance,x.minutes*60+x.seconds)+' /mi'}))].sort((a,b)=>b.date.localeCompare(a.date));return '<div class="card"><h2>Recorded sessions</h2>'+ (entries.length?entries.map(x=>'<div class="runrow"><span class="pill">'+x.type+'</span> <strong>'+dateShort(x.date)+' · '+escapeHTML(x.title)+'</strong><div class="muted">'+escapeHTML(x.detail)+'</div></div>').join(''):'<p>No completed records yet. This is separate from scheduled workouts.</p>')+'</div>'}
function pace(dist,sec){let v=Math.round(sec/dist);return dist>0&&sec>0?Math.floor(v/60)+':'+String(v%60).padStart(2,'0'):'—'}
function progress(){let sets=db.lifts.flatMap(l=>l.exercises.flatMap(e=>e.sets.filter(s=>s.done&&s.reps>0).map(s=>({...s,name:e.name,date:l.date}))));let latest={};sets.forEach(s=>{const old=latest[s.name];if(!old||s.date>=old.date&&s.weight>=old.weight)latest[s.name]=s});let miles=db.runs.reduce((a,x)=>a+x.distance,0);let h='<div class="grid"><div class="metric"><strong>'+db.lifts.filter(x=>x.finished).length+'</strong><span>Lift sessions</span></div><div class="metric"><strong>'+db.runs.length+'</strong><span>Runs</span></div><div class="metric"><strong>'+miles.toFixed(1)+'</strong><span>Run miles</span></div></div><div class="card"><h2>Working-weight records</h2><p>Highest logged completed working set by movement. Not estimated one-rep max.</p>';h+=Object.entries(latest).length?Object.entries(latest).map(([n,x])=>'<div class="runrow"><strong>'+escapeHTML(n)+'</strong><div class="muted">'+x.weight+' lb × '+x.reps+' · '+x.date+'</div></div>').join(''):'<p>No sets logged yet.</p>';h+='</div><div class="card"><h2>Running trends</h2>';h+=db.runs.length?db.runs.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>'<div class="runrow"><strong>'+dateShort(x.date)+'</strong> · '+x.distance+' mi · '+pace(x.distance,x.minutes*60+x.seconds)+' /mi</div>').join(''):'<p>No runs recorded yet.</p>';return h+'</div>'}
function settings(){return '<div class="card"><h2>GitHub backup</h2><p>Local saves work offline. To sync across devices, use a private GitHub repository dedicated to training data. Never store a personal access token in this public repository.</p><label>Private data repository (owner/repo)<input id="gh-repo" placeholder="username/private-training-data" value="'+escapeHTML(localStorage.getItem('rb_sync_repo')||'')+'"></label><label>Fine-grained GitHub token (Contents: read/write, restricted to private data repo)<input id="gh-token" type="password" placeholder="Not saved to disk" value="'+escapeHTML(sessionStorage.getItem('rb_sync_token')||'')+'"></label><div class="actions"><button onclick="syncConfig()">Use credentials</button><button onclick="syncGitHub(false)">Back up to GitHub</button><button onclick="syncGitHub(true)">Download from GitHub</button></div><p class="muted">Manual sync. Download overwrites this device after a confirmation. Run a backup before switching devices. The token stays only in this browser tab/session, not in the GitHub codebase.</p><div id="sync-status" class="muted"></div></div><div class="card"><h2>Data export / restore</h2><div class="actions"><button onclick="exportData()">Export JSON</button><button onclick="el(\'import-file\').click()">Import JSON</button><input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importData(this)"></div><p class="muted">Export is a separate safety copy. Existing Range Board v1 data is not deleted.</p></div><div class="card"><h2>Source</h2><a href="https://github.com/matthewgperez1-rgb/Workout" target="_blank">View code on GitHub</a></div>'}
function syncConfig(){let repo=el('gh-repo').value.trim(),token=el('gh-token').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){alert('Use owner/repo format');return}localStorage.setItem('rb_sync_repo',repo);if(token)sessionStorage.setItem('rb_sync_token',token);el('sync-status').textContent='Credentials loaded for this browser session.'}
async function syncGitHub(pull){syncConfig();const repo=localStorage.getItem('rb_sync_repo'),token=sessionStorage.getItem('rb_sync_token');if(!repo||!token){alert('Private repository and token required.');return}if(pull&&!confirm('Replace local Range Board v2 data with the saved GitHub data? Export a backup first.'))return;const status=el('sync-status');status.textContent='Contacting GitHub…';try{const url='https://api.github.com/repos/'+repo+'/contents/rangeboard-data.json';const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};let get=await fetch(url,{headers,cache:'no-store'});if(pull){if(!get.ok)throw Error('GitHub download: HTTP '+get.status);let meta=await get.json();let decoded=decodeURIComponent(Array.from(atob(meta.content.replace(/\s/g,'')),c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''));let next=JSON.parse(decoded);if(next.schema!==2||!Array.isArray(next.lifts)||!Array.isArray(next.runs))throw Error('Unsupported file format');db=next;persist();status.textContent='Downloaded. '+stamp();render();return}
if(get.status!==404&&!get.ok)throw Error('GitHub lookup: HTTP '+get.status);let old=get.ok?await get.json():null;let utf8=new TextEncoder().encode(JSON.stringify(db,null,2));let bin='';utf8.forEach(b=>bin+=String.fromCharCode(b));let body={message:'Update private Range Board training log',content:btoa(bin)};if(old)body.sha=old.sha;let resp=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});if(resp.status===409)throw Error('Sync conflict: remote data changed. Back up local JSON before resolving.');if(!resp.ok)throw Error('GitHub write: HTTP '+resp.status);status.textContent='Backed up to GitHub. '+stamp()}catch(e){status.textContent=e.message+' — local data is unchanged.'}}
function exportData(){const a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='rangeboard-'+TODAY()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function importData(input){try{let x=JSON.parse(await input.files[0].text());if(x.schema!==2||!Array.isArray(x.lifts)||!Array.isArray(x.runs))throw Error('Wrong format');if(!confirm('Replace this device’s Range Board v2 data?'))return;db=x;persist();render()}catch(e){alert(e.message)}}
function render(){el('main').innerHTML=({today:today,plan:planView,history,progress,settings})[tab]();clock()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.tab));clock();render();setInterval(clock,30000);
</script></body></html>
