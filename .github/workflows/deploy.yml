name: Publish Training Log
on:
  workflow_run:
    workflows: ["Training Log QA"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: training-log-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static distribution
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest fixes.css v3.css enhancements.js training-core.mjs sw.js icon.svg v4.js v4.css v5.js v5.css dist/
          test -s dist/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
