name: Publish Training Log
on:
  workflow_run:
    workflows: ["Training Log QA"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: training-log-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static distribution
        run: |
          node scripts/build.mjs
          test -s dist/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Install production browser verification
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the actual published application
        env:
          TRAINING_LOG_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-live.mjs
      - name: Preserve actual production browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-log-production-verification
          path: qa-production/
          retention-days: 14
