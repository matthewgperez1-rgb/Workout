name: Training Log QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate JavaScript syntax and regression tests
        run: |
          node --check tests/domain.test.mjs
          node --check training-core.mjs
          node --check tests/training-core.test.mjs
          node --test tests/*.test.mjs
      - name: Validate app assets and embedded JavaScript
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('index.html','utf8');
          const match=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!match)throw Error('Missing application script');
          new vm.Script(match[1],{filename:'index.html embedded JS'});
          for(const p of ['manifest.webmanifest','fixes.css','v3.css','training-core.mjs']) if(!fs.existsSync(p))throw Error('Missing '+p);
          JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          console.log('App syntax and required assets validated');
          NODE
