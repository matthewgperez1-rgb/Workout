name: Training Log QA
on:
  push:
    branches: [main, training-log-v3]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check syntax and storage / scheduling / analytics regressions
        run: |
          node --check app.mjs
          node --check sw.js
          for file in modules/*.mjs; do node --check "$file"; done
          node --test tests/model.test.mjs tests/domain.test.mjs tests/training-core.test.mjs
          node scripts/build.mjs
      - name: Install mobile browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Chromium functional and visual checks
        run: BROWSER=chromium node --test tests/browser.test.mjs
      - name: WebKit functional and visual checks
        run: BROWSER=webkit node --test tests/browser.test.mjs
      - name: Capture five screen compositions and actual app
        if: always()
        run: node scripts/capture.mjs
      - name: Save screenshots and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-log-mobile-qa
          path: qa-output/
          retention-days: 14
