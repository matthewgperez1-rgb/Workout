name: Training Log QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate source and regression tests
        run: |
          node --check app.mjs
          node --check program.mjs
          node --check sw.js
          node --test tests/domain.test.mjs tests/training-core.test.mjs
      - name: Install headless browser testing tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test app interactions on mobile-sized Chromium
        run: node --test tests/browser.test.mjs
      - name: Validate production assets
        run: |
          test -s index.html
          test -s app.css
          test -s app.mjs
          test -s program.mjs
          test -s manifest.webmanifest
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          grep -q 'src="./app.mjs"' index.html
